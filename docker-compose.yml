services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mytechinfo:local
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_LOG_TO_STDOUT: "true"
    volumes:
      - storage:/rails/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  storage:
    driver: local
