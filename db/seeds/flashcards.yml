      - front: "키워드 일치가 아니라 의미가 비슷한 문서를 찾는 검색 방식. 질문 표현이 문서와 달라도 관련 자료를 찾는 데 유리하다."
        back: "Semantic Search (의미 기반 검색)"
        tags: "AI활용,검색"
      - front: "AI가 검색, 파일 읽기, 코드 실행, API 호출 같은 외부 도구를 사용해 답변하거나 작업을 수행하는 기능."
        back: "Tool Use (도구 사용)"
        tags: "AI활용,도구"
      - front: "AI가 정해진 스키마에 맞춰 함수나 API 호출 인자를 생성하는 방식. 자연어 요청을 안전한 시스템 동작으로 연결할 때 쓴다."
        back: "Function Calling (함수 호출)"
        tags: "AI활용,도구"
      - front: "목표를 받아 계획을 세우고, 도구를 호출하고, 결과를 보고 다음 행동을 결정하는 AI 기반 작업 실행자."
        back: "AI Agent (AI 에이전트)"
        tags: "AI활용,에이전트"
      - front: "AI가 위험한 작업을 하거나 잘못된 출력을 내지 않도록 제한하는 규칙, 검증 로직, 승인 절차의 묶음."
        back: "Guardrail (가드레일)"
        tags: "AI활용,안전"
      - front: "외부 문서나 사용자 입력에 숨은 지시문이 AI의 원래 규칙을 우회하도록 유도하는 공격. RAG와 에이전트에서 중요한 보안 리스크다."
        back: "Prompt Injection (프롬프트 인젝션)"
        tags: "AI활용,보안"
      - front: "프롬프트, 로그, 학습 데이터, 외부 API 호출을 통해 민감 정보가 의도치 않게 노출되는 문제."
        back: "Data Leakage (데이터 유출)"
        tags: "AI활용,보안"
      - front: "이름, 전화번호, 이메일, 계좌번호 같은 개인정보를 AI에 보내기 전 제거하거나 대체하는 처리."
        back: "PII Redaction (개인정보 마스킹)"
        tags: "AI활용,보안"
      - front: "개발자가 AI와 함께 설계, 구현, 테스트, 리뷰를 반복하는 개발 방식. AI는 초안과 탐색을 돕고 최종 판단은 개발자가 한다."
        back: "AI Pair Programming (AI 페어 프로그래밍)"
        tags: "AI활용,개발"
      - front: "구현 요청 전에 요구사항, 성공 기준, 입력과 출력, 예외 상황을 명확한 스펙으로 정리해 AI에게 전달하는 방식."
        back: "Spec-driven Prompting (스펙 기반 프롬프팅)"
        tags: "AI활용,개발"
      - front: "개발자가 자연어로 의도를 설명하고 AI가 빠르게 코드를 생성하게 하며, 실행과 검증을 반복해 방향을 잡는 개발 방식. 빠르지만 검증 책임이 중요하다."
        back: "Vibe Coding (바이브 코딩)"
        tags: "AI활용,개발"

