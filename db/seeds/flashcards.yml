# 낱말카드 v1 — 공식 덱 시드 데이터.
#
# Wave 5.1 (AI-assisted draft + human review) 단계에서 cards: 배열을 채웁니다.
# 각 카드의 `draft: true` 플래그는 검토 전 임시 카드를 표시하며, 시드 로더는
# 경고만 출력합니다 (블로킹 아님).
#
# 각 덱의 expected_card_count는 시드 로더가 강제하는 카운트 게이트입니다.
# tags는 문자열 (쉼표 구분) — t.string :tags 컬럼.
#
# 작성 기준: IFP / USA Pickleball 공식 룰 (Official Rulebook). 모호한 영역은
# 작성하지 않음. 사용자가 검토 후 draft 플래그 제거 또는 수정.
official_decks:
  - title: "피클볼 기본 룰 30선"
    description: "코트 진입 전 반드시 알아야 할 핵심 룰 30가지"
    expected_card_count: 30
    cards:
      - front: "자기 코트의 오른쪽 또는 왼쪽 서비스 코트에서 대각선 반대편 상대 서비스 코트로."
        back: "서브 방향 (대각선)"
        hint: "테니스 서브 방향과 동일"
        tags: "서브,기본"
        draft: true
      - front: "네트 양쪽으로 7피트(약 2.13m) 폭으로 그어진 구역. 이 구역에 발이 닿은 상태에서 발리(공중 타격) 금지."
        back: "키친 (NVZ)"
        hint: "단어가 의미하는 '주방'은 농담 — 공식 명칭은 NVZ"
        tags: "키친,용어,기본"
        draft: true
      - front: "서브 후 리시버는 반드시 한 번 바운스시킨 뒤 리턴해야 하고, 서버 팀도 첫 리턴은 바운스 후 쳐야 한다. 즉 첫 두 샷은 무조건 바운스."
        back: "더블 바운스 룰"
        hint: "초반 두 샷만 적용"
        tags: "기본,서브,더블바운스"
        draft: true
      - front: "폴트. 키친 라인은 NVZ에 포함되므로 라인 접촉만으로도 발리 시 폴트가 된다."
        back: "키친 라인 발리 폴트"
        hint: "라인은 키친의 일부"
        tags: "키친,룰,폴트"
        draft: true
      - front: "허용된다. NVZ는 발리(공중 타격)만 금지하며, 바운스된 공을 치는 것은 합법."
        back: "키친 내 그라운드스트로크"
        hint: "발리 ≠ 그라운드스트로크"
        tags: "키친,룰"
        draft: true
      - front: "한 발은 반드시 베이스라인 뒤에 있어야 하며, 양 발 모두 사이드라인과 센터라인의 가상 연장선 사이에 위치해야 한다."
        back: "서브 풋 포지션"
        hint: "베이스라인 밟으면 풋폴트"
        tags: "서브,룰"
        draft: true
      - front: "라켓 헤드를 손목 아래에서 위로 향하는 스윙으로 공에 접촉. 접촉 지점은 허리 아래여야 한다."
        back: "언더핸드 서브"
        hint: "위에서 아래로 치면 폴트"
        tags: "서브,룰"
        draft: true
      - front: "공을 손에서 떨어뜨려 한 번 바운스시킨 후 서브하는 방식. 2021년 룰 개정으로 정식 허용. 언더핸드 제약을 받지 않는다."
        back: "드롭 서브 (Drop Serve)"
        hint: "토스나 추가 충격 금지 — 단순 낙하"
        tags: "서브,룰"
        draft: true
      - front: "서브권을 상대팀에게 넘기는 것. 더블에서는 두 명의 서버가 모두 실점한 뒤 발생한다."
        back: "사이드아웃"
        hint: "서브권 이동 사건"
        tags: "스코어링,용어"
        draft: true
      - front: "서브 팀만 득점 가능. 리시브 팀이 랠리를 이겨도 점수가 아닌 서브권만 얻는다."
        back: "전통 스코어링 득점 원칙"
        hint: "Rally 스코어링과의 핵심 차이"
        tags: "스코어링,기본"
        draft: true
      - front: "한 명만 서브한다. 첫 서브에서만 적용되는 first server exception. 사이드아웃되면 상대팀으로 넘어간다."
        back: "First Server Exception"
        hint: "이후 사이드아웃마다 양 서버 사용"
        tags: "서브,스코어링"
        draft: true
      - front: "더블 전통 스코어링에서는 세 숫자: 서브 팀 점수 - 리시브 팀 점수 - 서버 번호(1 또는 2)."
        back: "스코어 콜 형식 (세 숫자)"
        hint: "예: 5-3-2"
        tags: "스코어링,콜아웃"
        draft: true
      - front: "현재 서브 팀의 첫 번째 서버(1) 또는 두 번째 서버(2)를 뜻한다. 사이드아웃되기 전 두 번의 서브 기회 중 어느 것인지 표시."
        back: "서버 번호 1·2"
        hint: "1 → 실점 → 2 → 실점 → 사이드아웃"
        tags: "스코어링,용어"
        draft: true
      - front: "코트 오른쪽(짝수 코트, even court)에서 서브한다. 홀수면 왼쪽."
        back: "짝수·홀수 서브 코트"
        hint: "0도 짝수"
        tags: "서브,스코어링"
        draft: true
      - front: "11점. 단, 2점 이상 차이로 이겨야 종료된다. 토너먼트 결승은 15 또는 21점이 흔하다."
        back: "11점제 (Win by 2)"
        hint: "Win by 2"
        tags: "스코어링,게임"
        draft: true
      - front: "인이다. 베이스라인/사이드라인/센터라인 모두 인플레이 라인. 단, 서브 시 NVZ 라인(키친 라인)에 떨어지면 폴트."
        back: "라인 = 인"
        hint: "예외: 서브 시 키친 라인은 폴트"
        tags: "라인콜,서브"
        draft: true
      - front: "폴트 — 서브 팀에 점수(또는 서브권)를 빼앗긴다. 리시브 팀은 첫 리턴을 반드시 바운스 후 쳐야 한다."
        back: "더블 바운스 위반 폴트"
        hint: "더블 바운스 룰 위반"
        tags: "기본,폴트,더블바운스"
        draft: true
      - front: "그 샷을 친 플레이어의 폴트. 네트를 넘기 전에 닿았다면 친 사람 책임."
        back: "영구 시설물 접촉 폴트"
        hint: "넘긴 후 영구물 접촉 → 그 팀의 폴트"
        tags: "폴트,코트"
        draft: true
      - front: "2021년 룰 개정 이후 let은 폐지되었고, 네트를 맞고 적법한 서비스 코트에 떨어진 서브는 인플레이."
        back: "서브 렛 폐지"
        hint: "테니스 let과 다름"
        tags: "서브,룰"
        draft: true
      - front: "인플레이. 네트 접촉 후 상대 코트 인사이드 라인 안에 떨어지면 정상 진행."
        back: "랠리 네트 터치 = 인플레이"
        hint: "랠리에는 let 개념 없음"
        tags: "기본,네트"
        draft: true
      - front: "양 팀 어느 누구도 공이 인이라고 명확히 보지 못했다면 아웃 콜은 인정된다. 의심스러우면 상대에게 유리하게(인) 콜하는 것이 매너."
        back: "라인콜 원칙"
        hint: "When in doubt, call it in"
        tags: "라인콜,매너"
        draft: true
      - front: "공이 라켓 면에 잠깐 머무르며 운반되듯 쳐지는 것. 폴트로 간주된다."
        back: "캐리 (Carry)"
        hint: "한 번의 접촉이 아니어야 함"
        tags: "폴트,스트로크"
        draft: true
      - front: "한 번의 연속된 스윙으로 공을 두 번 친 것. 의도적이면 폴트, 한 동작이면 합법으로 인정될 수 있다."
        back: "더블 힛 (Double Hit)"
        hint: "의도/연속성이 판단 기준"
        tags: "폴트,스트로크"
        draft: true
      - front: "폴트 (라켓 손목 아래 부위 포함). 네트를 넘은 후라도 공이 라켓이 아닌 신체에 닿으면 그 사람 폴트."
        back: "신체 접촉 폴트"
        hint: "라켓 외 접촉은 폴트"
        tags: "폴트,기본"
        draft: true
      - front: "공이 바운스되기 전 공중에서 라켓으로 치는 것. 키친(NVZ) 안에 발이 있으면 금지."
        back: "발리 (Volley)"
        hint: "그라운드스트로크와 대비"
        tags: "용어,스트로크"
        draft: true
      - front: "키친 라인 근처에서 부드럽게 쳐서 상대 키친에 살짝 떨어뜨리는 컨트롤 샷."
        back: "딩크 (Dink)"
        hint: "공격성보다 정확성 중심"
        tags: "용어,스트로크"
        draft: true
      - front: "폴트. 발리한 후 모멘텀으로 키친 라인을 밟거나 안쪽으로 들어가면 안 된다. 라켓이나 모자가 떨어져도 폴트."
        back: "모멘텀 폴트"
        hint: "발리 후 정지 위치도 키친 밖이어야"
        tags: "키친,폴트"
        draft: true
      - front: "두 발이 모두 NVZ 밖에 있어야 발리 가능. 키친에서 벗어났더라도 직전 동작이 키친 안이었다면 완전히 빠져나온 뒤 발리."
        back: "키친 탈출 발리"
        hint: "두 발 모두 NVZ 밖"
        tags: "키친,발리,룰"
        draft: true
      - front: "더블 전통 스코어링에서는 0-0-2로 시작. 첫 서브 팀은 한 명만 서브하기 때문에 서버 번호 2로 표시."
        back: "첫 서브 콜 (0-0-2)"
        hint: "first server exception"
        tags: "스코어링,콜아웃,서브"
        draft: true
      - front: "폴트. 라켓이 손에서 떨어지면 그 시점부터의 접촉은 더 이상 합법 스트로크가 아니다."
        back: "라켓 드롭 폴트"
        hint: "라켓을 잡고 있어야 정상 스트로크"
        tags: "폴트,스트로크"
        draft: true
  - title: "영어 콜아웃 & 용어"
    description: "국제 대회나 외국인과 경기 시 자주 듣는 영어 표현 모음"
    expected_card_count: 25
    cards:
      - front: "dink"
        back: "키친 근처에서 부드럽게 띄워 상대 키친에 살짝 떨어뜨리는 컨트롤 샷."
        hint: "한국어 표기: 딩크"
        tags: "스트로크,용어"
        draft: true
      - front: "third shot drop"
        back: "서브-리턴-제3샷의 세 번째 샷으로, 베이스라인에서 상대 키친 근처에 떨어지도록 부드럽게 띄우는 샷. NVZ 진출을 위한 핵심 전략."
        hint: "딩크 랠리 진입용"
        tags: "전략,스트로크"
        draft: true
      - front: "lob"
        back: "상대 머리 위로 높게 띄워 베이스라인 근처에 떨어뜨리는 샷. 상대를 키친에서 밀어내는 용도."
        hint: "수비/전환용"
        tags: "스트로크,전략"
        draft: true
      - front: "Erne"
        back: "키친을 우회하여 사이드라인 바깥쪽에서 발리하는 고급 기술. 키친 밖에 발이 있으면 합법."
        hint: "선수 이름에서 유래"
        tags: "전략,발리"
        draft: true
      - front: "ATP (Around The Post)"
        back: "공을 네트가 아닌 포스트(기둥) 옆으로 돌려서 보내는 샷. 네트 위를 넘기지 않아도 합법."
        hint: "각도가 매우 예리할 때"
        tags: "스트로크,전략"
        draft: true
      - front: "stack"
        back: "복식에서 두 파트너가 코트 한쪽에 함께 서서 자기 선수에게 유리한 위치로 정렬하는 포메이션."
        hint: "포핸드를 가운데로"
        tags: "전략,포지셔닝"
        draft: true
      - front: "paddle"
        back: "피클볼에서 사용하는 라켓. 테니스의 라켓이 아닌 패들(나무·복합소재 판)이다."
        hint: "Racket이 아닌 Paddle"
        tags: "용어,장비"
        draft: true
      - front: "fault"
        back: "랠리를 잃게 만드는 룰 위반. 서브 실패, 키친 발리, 아웃, 네트 접촉 등 다양한 종류가 있다."
        hint: "한국어: 폴트"
        tags: "용어,룰"
        draft: true
      - front: "let"
        back: "랠리를 무효로 하고 다시 시작하는 콜. 2021년 룰 개정으로 서브 let은 폐지됨."
        hint: "현재는 매우 드물게만 사용"
        tags: "용어,룰"
        draft: true
      - front: "side out"
        back: "서브권이 상대 팀으로 넘어가는 것. 더블에서는 양 서버 모두 실점한 후 발생."
        hint: "한국어: 사이드아웃"
        tags: "스코어링,콜아웃"
        draft: true
      - front: "kitchen"
        back: "Non-Volley Zone(NVZ)의 별명. 네트 양쪽 7피트 구역으로 발리 금지."
        hint: "농담조 별명"
        tags: "코트,용어"
        draft: true
      - front: "rally"
        back: "서브 이후 점수가 결정될 때까지 양 팀이 공을 주고받는 구간."
        hint: "득점 또는 사이드아웃으로 종료"
        tags: "용어,기본"
        draft: true
      - front: "volley"
        back: "공이 바운스되기 전 공중에서 치는 샷. NVZ 안에서는 금지."
        hint: "발리"
        tags: "스트로크,용어"
        draft: true
      - front: "ground stroke"
        back: "공이 한 번 바운스된 후 치는 샷. NVZ 안에서도 합법."
        hint: "발리와 대비"
        tags: "스트로크,용어"
        draft: true
      - front: "poach"
        back: "복식에서 파트너의 공을 가로채서 발리하는 공격적 움직임."
        hint: "주로 네트 플레이"
        tags: "전략,복식"
        draft: true
      - front: "first server exception"
        back: "더블 게임 시작 시 첫 서브 팀은 서버 한 명만 사용한다는 규칙. 이후 사이드아웃부터는 양 서버 사용."
        hint: "0-0-2로 시작하는 이유"
        tags: "서브,룰"
        draft: true
      - front: "ace"
        back: "리시버가 라켓에 닿지도 못한 채 끝나는 서브. 직접 득점."
        hint: "서브 즉시 득점"
        tags: "서브,용어"
        draft: true
      - front: "drop serve"
        back: "공을 손에서 떨어뜨려 한 번 바운스시킨 뒤 서브하는 방식. 2021년 정식 허용."
        hint: "토스 금지"
        tags: "서브,용어"
        draft: true
      - front: "open / closed face"
        back: "패들 면이 위로(open) 또는 아래로(closed) 향한 상태. 슬라이스/탑스핀과 궤적을 결정."
        hint: "면 각도 용어"
        tags: "스트로크,용어"
        draft: true
      - front: "non-volley zone (NVZ)"
        back: "키친의 공식 명칭. 네트 양쪽 7피트 구역으로 발리 금지."
        hint: "줄여서 NVZ"
        tags: "코트,용어"
        draft: true
      - front: "baseline"
        back: "코트의 가장 뒤쪽 라인. 서브 시 한 발이 이 라인 뒤에 있어야 한다."
        hint: "서브 발 위치 기준선"
        tags: "코트,용어"
        draft: true
      - front: "centerline"
        back: "서비스 코트를 좌우로 나누는 중앙선. 서브 위치 결정에 사용."
        hint: "센터라인"
        tags: "코트,용어"
        draft: true
      - front: "sideline"
        back: "코트의 좌우 경계선. 라인 위에 떨어지면 인."
        hint: "사이드라인"
        tags: "코트,용어"
        draft: true
      - front: "punch volley"
        back: "팔로스루 없이 짧게 끊어 치는 발리. 키친 근처에서 강한 압박용."
        hint: "Block volley와 유사"
        tags: "스트로크,발리"
        draft: true
      - front: "rally scoring"
        back: "서브 팀이 아니어도 랠리를 이기면 득점하는 방식. 일부 토너먼트에서만 사용 (기본은 전통 side-out)."
        hint: "전통 스코어링과 구분"
        tags: "스코어링,용어"
        draft: true
  - title: "스코어링 시나리오 20"
    description: "전통/Rally 스코어링 상황별 점수 변화 시나리오"
    expected_card_count: 20
    cards:
      - front: "[전통] 게임 시작 시 첫 콜은?"
        back: "0-0-2 (또는 0-0-start). 첫 서브 팀은 first server exception으로 한 명만 서브."
        hint: "서버 번호 2"
        tags: "전통,시작"
        draft: true
      - front: "[전통] 서버 1이 서브 → 랠리 이김. 다음 콜은?"
        back: "1-0-1. 같은 서버가 계속 서브하며 점수만 1 증가."
        hint: "서브 측면도 짝/홀에 따라 바뀜"
        tags: "전통,득점"
        draft: true
      - front: "[전통] 점수 1-0-1에서 서버가 실점. 다음 콜은?"
        back: "0-1-2. 서브권은 그대로 같은 팀에 남고 두 번째 서버에게 넘어간다."
        hint: "사이드아웃 아님"
        tags: "전통,실점"
        draft: true
      - front: "[전통] 점수 0-1-2에서 서버 2도 실점. 다음 콜은?"
        back: "1-0-1. 사이드아웃 — 서브권이 상대 팀으로 넘어가고 상대 팀의 서버 1부터 시작."
        hint: "양 서버 모두 실점 → 사이드아웃"
        tags: "전통,사이드아웃"
        draft: true
      - front: "[전통] 점수 0-0-2(시작)에서 서버 실점. 다음 콜은?"
        back: "0-0-1. 첫 서브 팀은 한 명만 서브하므로 즉시 사이드아웃되어 상대팀의 서버 1로 넘어간다."
        hint: "first server exception 적용"
        tags: "전통,사이드아웃,시작"
        draft: true
      - front: "[전통] 서브 팀 점수가 짝수일 때 서버는 어디에 서야 하는가?"
        back: "코트의 오른쪽(짝수 코트). 점수 0, 2, 4 등."
        hint: "0도 짝수"
        tags: "전통,서브위치"
        draft: true
      - front: "[전통] 서브 팀 점수가 홀수일 때 서버 위치는?"
        back: "코트의 왼쪽(홀수 코트). 점수 1, 3, 5 등."
        hint: "짝/홀 규칙"
        tags: "전통,서브위치"
        draft: true
      - front: "[전통] 서브 콜을 잘못 부르고 랠리가 진행되면?"
        back: "원칙: 랠리 시작 전 정정 가능. 시작된 후에는 그 랠리를 마치고 다음 서브 전에 정정. 콜 자체는 폴트 사유 아님."
        hint: "오심성 폴트 아님"
        tags: "전통,콜아웃,룰"
        draft: true
      - front: "[전통] 잘못된 코트(짝/홀 반대)에서 서브하고 발견되면?"
        back: "그 랠리는 폴트 처리. 적용 시점은 룰북 §4 참조 — 발견된 직후 폴트."
        hint: "wrong server 또는 wrong court fault"
        tags: "전통,서브,폴트"
        draft: true
      - front: "[전통] 점수 10-9-2에서 서버 실점. 다음 콜은?"
        back: "9-10-1. 사이드아웃, 상대 팀의 서버 1이 9점으로 시작."
        hint: "11점 게임 매치포인트 직전"
        tags: "전통,사이드아웃"
        draft: true
      - front: "[전통] 점수 10-5-1에서 서버 득점. 다음 콜은?"
        back: "11-5-1. 11점 도달 + 6점차로 게임 종료(win by 2 충족)."
        hint: "Game point"
        tags: "전통,게임종료"
        draft: true
      - front: "[전통] 점수 10-10에서 서버가 득점하면?"
        back: "11-10-X로 진행. 단 2점차 룰 때문에 게임은 끝나지 않는다 (11-9가 되어야 종료)."
        hint: "Win by 2"
        tags: "전통,듀스"
        draft: true
      - front: "[Rally] 점수 5-3에서 리시브 팀이 랠리 이기면?"
        back: "리시브 팀이 1점 득점하여 5-4 (서브권도 넘어감). Rally scoring은 서브 팀이 아니어도 득점 가능."
        hint: "전통과의 핵심 차이"
        tags: "Rally,득점"
        draft: true
      - front: "[Rally] Rally 스코어링의 게임 종료 점수는?"
        back: "토너먼트별로 다르지만 흔히 15점 또는 21점, 2점차 필수. 전통(11점)보다 높게 설정."
        hint: "Win by 2"
        tags: "Rally,게임종료"
        draft: true
      - front: "[전통] 5-3-2 콜 의미는?"
        back: "서브 팀이 5점, 리시브 팀이 3점, 현재 서버 번호 2(두 번째 서버)."
        hint: "세 숫자 콜"
        tags: "전통,콜아웃"
        draft: true
      - front: "[전통] 서버가 서브 시 베이스라인을 밟으면?"
        back: "풋폴트 — 즉시 폴트. 다음 서버에게 넘어가거나 사이드아웃."
        hint: "발 위치 룰"
        tags: "전통,폴트,서브"
        draft: true
      - front: "[전통] 서브가 키친 라인에 떨어지면?"
        back: "폴트. 서브는 키친 라인을 포함한 NVZ 내부에 떨어지면 안 된다."
        hint: "서브에 한해 NVZ 라인=아웃"
        tags: "전통,서브,폴트"
        draft: true
      - front: "[전통] 리시버가 서브를 발리로 받으면?"
        back: "폴트 — 더블 바운스 룰 위반. 서버 팀에 1점 또는 서브권 유지."
        hint: "첫 두 샷은 필수 바운스"
        tags: "전통,더블바운스,폴트"
        draft: true
      - front: "[전통] 점수 0-0-2에서 서버 득점. 다음 콜은?"
        back: "1-0-2. 점수가 1로 증가하고 서버는 짝→홀 코트로 측면 이동."
        hint: "서버 번호 유지"
        tags: "전통,득점,시작"
        draft: true
      - front: "[전통] 11점 도달했으나 점수차가 1일 때 (예: 11-10) 게임은?"
        back: "끝나지 않는다. Win by 2 룰에 따라 12-10 이상이 되어야 종료."
        hint: "딜레마: 듀스 연장"
        tags: "전통,듀스,게임종료"
        draft: true
  - title: "주식투자 기초 용어 30선"
    description: "주식시장에서 반드시 알아야 할 기초 투자 용어 30개를 정리한 공식 학습 덱입니다."
    expected_card_count: 30
    cards:
      - front: "주식 (Stock)"
        back: "회사 소유권의 일부를 나타내는 증서. 주주는 회사의 이익과 손실을 지분만큼 분담한다."
        tags: "기초,증권"
      - front: "시가총액 (Market Capitalization)"
        back: "발행 주식 수 × 현재 주가. 기업의 시장 가치를 나타내는 핵심 지표다."
        tags: "기초,가치평가"
      - front: "PER (주가수익비율, Price-to-Earnings Ratio)"
        back: "주가 ÷ EPS(주당순이익). 주식이 이익 대비 얼마나 비싸게 거래되는지를 나타낸다. 낮을수록 저평가 가능성이 있다."
        tags: "가치평가,재무지표"
      - front: "PBR (주가순자산비율, Price-to-Book Ratio)"
        back: "주가 ÷ BPS(주당순자산). 1 미만이면 장부가치보다 낮게 거래된다는 의미다."
        tags: "가치평가,재무지표"
      - front: "EPS (주당순이익, Earnings Per Share)"
        back: "당기순이익 ÷ 발행 주식 수. 주당 얼마를 벌었는지 보여주는 수익성 지표다."
        tags: "재무지표"
      - front: "ROE (자기자본이익률, Return on Equity)"
        back: "순이익 ÷ 자기자본 × 100. 주주 자본으로 얼마나 효율적으로 이익을 냈는지 측정한다. 높을수록 우량 기업."
        tags: "재무지표,수익성"
      - front: "배당금 (Dividend)"
        back: "기업이 영업 이익의 일부를 주주에게 현금 또는 주식으로 분배하는 것."
        tags: "배당,수익"
      - front: "배당수익률 (Dividend Yield)"
        back: "주당 배당금 ÷ 현재 주가 × 100. 투자금 대비 배당 수익을 백분율로 나타낸다."
        tags: "배당,수익"
      - front: "IPO (기업공개, Initial Public Offering)"
        back: "비상장 기업이 처음으로 주식을 일반 투자자에게 공개 판매하는 것. 상장의 시작점이다."
        tags: "기초,시장구조"
      - front: "KOSPI (코스피)"
        back: "한국 유가증권시장(대형·우량주 중심)의 종합주가지수. 한국 증시 전반의 흐름을 보여준다."
        tags: "지수,한국시장"
      - front: "KOSDAQ (코스닥)"
        back: "한국의 중소·벤처·기술기업 중심의 주식시장 지수. 미국의 NASDAQ에 해당한다."
        tags: "지수,한국시장"
      - front: "호가 (Bid / Ask)"
        back: "매수자가 사겠다고 제시하는 가격(Bid)과 매도자가 팔겠다고 제시하는 가격(Ask)의 쌍. 두 가격의 차이를 스프레드라 한다."
        tags: "거래,기초"
      - front: "매수 / 롱 포지션 (Long)"
        back: "주식을 사는 행위. 주가 상승 시 이익이 발생한다."
        tags: "거래,기초"
      - front: "매도 / 숏 포지션 (Short)"
        back: "주식을 파는 행위. 보유 주식을 처분하거나 공매도를 통해 하락에 베팅할 수 있다."
        tags: "거래,기초"
      - front: "포트폴리오 (Portfolio)"
        back: "투자자가 보유한 다양한 자산(주식·채권·현금 등)의 집합. 분산투자의 결과물이다."
        tags: "전략,리스크관리"
      - front: "분산투자 (Diversification)"
        back: "여러 종목·자산군에 나누어 투자해 특정 자산의 손실이 전체에 미치는 영향을 줄이는 전략."
        tags: "전략,리스크관리"
      - front: "리밸런싱 (Rebalancing)"
        back: "목표 자산 배분 비율을 유지하기 위해 주기적으로 포트폴리오를 조정하는 행위."
        tags: "전략,포트폴리오"
      - front: "손절매 (Stop Loss)"
        back: "손실이 일정 수준에 달하면 주식을 팔아 추가 손실을 막는 전략. 리스크 관리의 기본이다."
        tags: "전략,리스크관리"
      - front: "익절 (Take Profit)"
        back: "목표 수익률에 도달했을 때 주식을 매도해 이익을 확정하는 행위."
        tags: "전략,수익"
      - front: "이동평균선 (Moving Average)"
        back: "일정 기간의 종가 평균을 연결한 선. 5일·20일·60일선 등으로 추세와 지지·저항 구간을 파악한다."
        tags: "기술적분석,차트"
      - front: "볼린저 밴드 (Bollinger Bands)"
        back: "이동평균선을 중심으로 표준편차 2배 범위의 상·하단 밴드를 그린 지표. 밴드 폭이 좁으면 변동성이 낮다."
        tags: "기술적분석,차트"
      - front: "RSI (상대강도지수, Relative Strength Index)"
        back: "0~100 사이로 과매수(70 이상)·과매도(30 이하) 상태를 나타내는 기술적 지표."
        tags: "기술적분석,모멘텀"
      - front: "공매도 (Short Selling)"
        back: "주식을 빌려서 판 뒤 가격이 내려가면 낮은 가격에 사서 갚아 차익을 얻는 투자 기법."
        tags: "고급전략,리스크"
      - front: "레버리지 (Leverage)"
        back: "차입금을 활용해 투자 규모를 확대하는 전략. 수익도 커지지만 손실도 그만큼 증폭된다."
        tags: "고급전략,리스크"
      - front: "ETF (상장지수펀드, Exchange-Traded Fund)"
        back: "특정 지수·섹터·상품을 추종하며 주식처럼 거래소에서 매매할 수 있는 펀드. 분산효과와 낮은 비용이 장점이다."
        tags: "금융상품,인덱스"
      - front: "채권 (Bond)"
        back: "정부나 기업이 자금 조달을 위해 발행하는 차용증서. 만기에 원금을 상환하고 이자(쿠폰)를 주기적으로 지급한다."
        tags: "금융상품,채권"
      - front: "선물 (Futures)"
        back: "미래의 특정 시점에 정해진 가격으로 자산을 사고팔기로 약속한 파생금융계약."
        tags: "파생상품,고급"
      - front: "옵션 (Option)"
        back: "특정 가격에 자산을 사거나(콜 옵션) 팔 수 있는(풋 옵션) 권리를 사고파는 파생금융계약."
        tags: "파생상품,고급"
      - front: "환율 (Exchange Rate)"
        back: "두 나라 통화 간의 교환 비율. 해외 주식이나 ETF 투자 시 환율 변동에 따른 환리스크가 발생한다."
        tags: "기초,국제투자"
      - front: "유동성 (Liquidity)"
        back: "자산을 손실 없이 빠르게 현금화할 수 있는 정도. 거래량이 많은 대형주일수록 유동성이 높다."
        tags: "기초,시장구조"
  - title: "개발자가 알아야 할 AI 기술 용어 30선"
    description: "LLM, RAG, 에이전트 등 현대 AI 개발 생태계를 이해하기 위한 핵심 기술 용어 30개를 정리한 공식 학습 덱입니다."
    expected_card_count: 30
    cards:
      - front: "수십억~수천억 개의 파라미터를 가진 신경망으로, 대규모 텍스트 데이터를 학습해 언어 이해·생성·추론을 수행한다. GPT-4, Claude, Gemini 등이 대표적이다."
        back: "LLM (대규모 언어 모델, Large Language Model)"
        tags: "기초,모델"
      - front: "2017년 논문 'Attention Is All You Need'에서 제안된 신경망 아키텍처. Self-Attention 메커니즘을 기반으로 하며 현대 LLM의 근간이 된다."
